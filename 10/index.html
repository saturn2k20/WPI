<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <tittle>ATIVIDADE 10</tittle>
        <style>
            .box {
                background-color: #b9c941;
                width: 300px;
                padding: 20px;
                border: 1px solid #38c54a;
                box-sizing: border-box;
                border-radius: 15px;
            }
            fieldset {
                border: 2px solid #000;
                padding: 10%;
            }
            legend {
                font-weight: bold;
            }
        </style>
    </head>
    <body>
    <div class="box">
        <fieldset>
            <legend>INFORMAÇOES PESSOAIS</legend>
            <label for="nome">NOME:</label>
            <input type="text" id="nome" name="nome"><br><br>
            <label for="email">EMAIL:</label>
            <input type="email" id="email" name="email"><br><br>
        </fieldset>
    </div>    
    </body>
</html>
