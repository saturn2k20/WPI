<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"
    <meta name="viewport"
content="width=device-width,initial-scale=1.0">
    <style>
        body {
            margin: 0;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .header, .footer {
            background-color :lightblue;
            height: 10%;
            text-align: center;
            padding: 10px;
        }
        .content {
            display: flex;
            flex: 1;
        }
        .left, .right {
            width: 25%;
            background-color: lightcoral;
            padding: 10px
        }
       .center {
            width: 50%;
            background-color : lightgreen;
            padding: 10px
        }
        .footer{
            background-color: lightpink;
            height: 100%; 
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">header 100%</div>
        <div class="content">
            <div class="left">left 25%</div>
            <div class="center">center 50%</div>
            <div class="Right">Right 25%</div>
            <div class="footer">Footer 100%</div>
        </div>
    </div>
</body>
</html>
