<!doctype html> 
<html> 
    <head> <title>Box Model</title>
         <meta charset="utf-8" />
          <style type="text/css"> 
            body {
                margin: 0%;
                padding: 0%;
                flex-direction: column;
                display: flex;
                color: aliceblue;
                font-family: 'Times New Roman', Times, serif;
            }
        .header {
            width: 45%;
            height: 35px;
            text-align: center;
            background-color: rgb(236, 227, 98);
        }
        .left {
            width: 15%;
            background-color: rgb(145, 243, 145);
            text-align: center;
            float: left;
            height: 250px;
            
        }
        .right{
            width: 15%;
            background-color:rgb(31, 10, 223);
            text-align: center;
            float: left;
            height: 250px;
        }

        .center {
            width:15%;
            text-align: center;
            background-color: rgb(26, 108, 163);
            position: relative;
            float:left;
            height: 250px;
        }
            
        .footer{
            width: 45%;
            height: 45px;
            text-align: center;
            background-color: rgb(201, 32, 164);
            }
         </style> 
          
        </head> 
    <body> 
        <div class="header">solta a carta tigrinho </div> 
        <div>
        <div class="left">faz favor</div>
        <div class="center">deixa o cara sio</div>
        <div class="right">te chamei</div>
        </div>
        <div class="footer">faz o l </div>
</body>    
    </html>
